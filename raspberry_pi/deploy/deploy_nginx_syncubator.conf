# Reverse proxy + TLS termination for the Syncubator Flask backend.
# Gunicorn is bound to 127.0.0.1:5000 only — this is the sole entry point.

server {
    listen 443 ssl;
    # Update to match the Pi's actual static IP.
    server_name 192.168.0.116;

    ssl_certificate     /etc/nginx/ssl/syncubator.crt;
    ssl_certificate_key /etc/nginx/ssl/syncubator.key;

    # Camera stream: must NOT be buffered, or the MJPEG multipart stream
    # will stall/lag badly waiting for Nginx to fill its buffer.
    location /video_feed {
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: normal proxying to Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# Redirect plain HTTP to HTTPS instead of just failing.
server {
    listen 80;
    server_name 192.168.0.116;
    return 301 https://$host$request_uri;
}
